q<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code - Tajweed Masterclass</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --emerald: #064e3b;
            --gold: #d4af37;
            --cream: #fdfbf7;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #f0f2f5;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        .card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 90%;
            border-top: 8px solid var(--emerald);
        }

        h1 {
            font-family: 'Playfair Display', serif;
            color: var(--emerald);
            margin-bottom: 10px;
            font-size: 1.8rem;
        }

        p {
            color: #64748b;
            font-size: 0.9rem;
            margin-bottom: 30px;
        }

        #qrcode {
            background: white;
            padding: 20px;
            border: 2px solid var(--gold);
            border-radius: 12px;
            display: inline-block;
            margin-bottom: 30px;
        }

        #qrcode img {
            margin: 0 auto;
        }

        .link-display {
            background: #f8fafc;
            padding: 10px;
            border-radius: 8px;
            font-size: 0.8rem;
            word-break: break-all;
            color: var(--emerald);
            border: 1px solid #e2e8f0;
            margin-bottom: 25px;
        }

        .btn-download {
            background: var(--emerald);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 30px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .btn-download:hover {
            background: var(--gold);
            transform: translateY(-2px);
        }

        .footer-note {
            margin-top: 20px;
            font-size: 0.75rem;
            color: #94a3b8;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Tajweed Masterclass</h1>
        <p>Scan to view the presentation</p>

        <div id="qrcode"></div>

        <div class="link-display">
            https://quraishytalhazubaer.github.io/tazweedmasterclass/
        </div>

        <button class="btn-download" onclick="downloadQR()">Download QR Code</button>

        <div class="footer-note">
            Hafiz Mukerrom Hossain Siddique Al-Quraishy<br>
            IBTRA
        </div>
    </div>

    <script>
        const url = "https://quraishytalhazubaer.github.io/tazweedmasterclass/";
        
        // Initialize QR Code
        const qrcode = new QRCode(document.getElementById("qrcode"), {
            text: url,
            width: 256,
            height: 256,
            colorDark: "#064e3b", // Emerald
            colorLight: "#ffffff",
            correctLevel: QRCode.CorrectLevel.H
        });

        function downloadQR() {
            const img = document.querySelector("#qrcode img");
            const link = document.createElement("a");
            link.href = img.src;
            link.download = "Tajweed_Masterclass_QR.png";
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
</html>
